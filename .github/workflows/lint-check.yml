name: Lint Check

on:
  push:
    branches: [develop, "product/offline-*"]

permissions:
  contents: read

jobs:
  agent-guidance:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Validate agent guidance
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: python3 scripts/check_agent_guidance.py --before "$BEFORE_SHA" --after "$HEAD_SHA"

  document-gate:
    runs-on: ubuntu-latest
    env:
      # Conventional uv cache location (AGENTS.md restricted-environment path);
      # setup-uv respects a pre-set UV_CACHE_DIR and still caches it.
      UV_CACHE_DIR: /tmp/deer-flow-uv-cache
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # Read-only, full-inventory check of the pushed candidate revision.
      # The checker never repairs files; a non-zero exit fails the job.
      - name: Validate document governance contracts
        run: python3 scripts/check_documents.py --repo-root .

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.1"

      - name: Install dependencies
        working-directory: backend
        run: |
          uv sync --group dev

      # Seconds-level offline contract tests for the intranet deploy bundle:
      # deploy/package/check scripts plus the bundled compose file and runbook
      # (docker/curl are faked via PATH, so the suite never touches the
      # network). Deliberately scoped to this one file, not the whole
      # unit/scripts tree, which runs for minutes; the rest of that tree stays
      # covered by the backend test lanes. This suite once stayed red on
      # develop for months because no CI job executed it.
      - name: Run document contract tests
        working-directory: backend
        run: uv run pytest tests/unit/scripts/test_intranet_deploy_scripts.py -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.1"

      - name: Install dependencies
        working-directory: backend
        run: |
          uv sync --group dev

      - name: Lint backend
        working-directory: backend
        run: make lint

  lint-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - name: Use pinned pnpm version
        run: corepack prepare pnpm@10.26.2 --activate

      - name: Install frontend dependencies
        run: |
          cd frontend
          pnpm install --frozen-lockfile

      - name: Run frontend linting
        run: |
          cd frontend
          pnpm lint

      - name: Check TypeScript types
        run: |
          cd frontend
          pnpm typecheck

      - name: Architecture boundary check
        run: |
          cd frontend
          npx depcruise src/ --config .dependency-cruiser.cjs

      - name: Build frontend
        run: |
          cd frontend
          BETTER_AUTH_SECRET=local-dev-secret pnpm build
