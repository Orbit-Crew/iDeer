name: 💡 Feature request
description: Propose a new capability or an improvement to an existing one.
title: "[feat] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Before writing code, please search the
        [existing issues](https://gitea.com/TechCode/iDeer/issues) (including
        closed ones) to confirm this is not a duplicate, and describe the
        affected scope clearly below so the request can be triaged in one pass.
        (Note: this site has no Discussions feature — the issue itself is
        the place to align on scope.)

  - type: checkboxes
    id: preflight
    attributes:
      label: Before you start
      options:
        - label: I searched [existing issues](https://gitea.com/TechCode/iDeer/issues) and this is not a duplicate.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What problem does this solve? What is painful today, or what does it unblock?
      placeholder: "I'm always frustrated when ..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the change from a user's / caller's perspective.
    validations:
      required: true

  - type: dropdown
    id: areas
    attributes:
      label: Affected area(s)
      description: Which part of iDeer would this touch? Select all that apply. The hint maps each area to its triage label.
      multiple: true
      options:
        - Frontend (UI / Next.js) → area:frontend
        - Backend API (gateway / endpoints / SSE) → area:backend
        - Agents / LangGraph (graph, prompts, langgraph.json) → area:agents
        - Sandbox / Docker → area:sandbox
        - Skills → area:skills
        - MCP → area:mcp
        - Docs → area:docs
        - Not sure
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you weighed and why you discarded them.

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Mockups, links, related issues, or anything else that helps.
